name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      TC_REQUIRE_DB: "1"
      PATH: /usr/local/go/bin:${{ env.PATH }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # check = vet + test-strict + build + mock + dbcheck + dryrun
      # dbcheck 在一次性库里跑 迁移 → seed → verify.sql，99 条不变量必须全绿
      - name: 提交前自检
        run: make check

      - name: 单元测试（带覆盖率）
        run: go test ./... -timeout 180s -coverprofile=coverage.out -covermode=atomic

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
